<!doctype html><meta charset="utf-8"><title>رفع</title>
<body style="font:16px sans-serif;background:#111;color:#eee">
<div id="s">جاهز</div>
<script>
// opened by the ok.ru tab (a real click): loads the clips from tools/stream/upload_server.py in 8 MB Range chunks (a full GET fails) and hands
// File objects to the opener by postMessage. Message {cmd:'send', sub, have:[names]} → {cmd:'file'}… then {cmd:'done'} or {cmd:'error'}.
const log = (m) => { document.getElementById('s').textContent = m; };
window.addEventListener('message', async (ev) => {
  const OK = ['https://ok.ru', 'https://studio.youtube.com', 'https://drive.google.com'];   /* (2026-11-13) YouTube Studio and Drive too */
  if (!OK.includes(ev.origin) || !ev.data || ev.data.cmd !== 'send') return;
  const O = ev.origin;
  try {
    const list = (await (await fetch('/list')).json()).filter((x) => (ev.data.sub == null || x.sub === ev.data.sub) && (!ev.data.names || ev.data.names.includes(x.name)));
    const skip = new Set(ev.data.have || []); let n = 0;
    for (const it of list) {
      if (skip.has(it.name)) continue;
      log('تحميل ' + (n + 1) + '/' + list.length + ' ' + it.name.slice(0, 40));
      const u = '/' + (it.sub ? encodeURIComponent(it.sub) + '/' : '') + encodeURIComponent(it.name), parts = [], CH = 8 * 1024 * 1024;
      for (let a = 0; a < it.size; a += CH) {
        const e = Math.min(a + CH, it.size) - 1; let bl = null;
        for (let k = 0; k < 5 && !bl; k++) { try { const r = await fetch(u, { headers: { Range: 'bytes=' + a + '-' + e } }); const x = await r.blob(); if (x.size === e - a + 1) bl = x; } catch (_) { await new Promise((z) => setTimeout(z, 1500)); } }
        if (!bl) throw new Error('chunk ' + it.name); parts.push(bl);
      }
      ev.source.postMessage({ cmd: 'file', file: new File(parts, it.name, { type: /\.jpe?g$/i.test(it.name) ? 'image/jpeg' : /\.png$/i.test(it.name) ? 'image/png' : 'video/mp4' }), size: it.size, i: ++n, total: list.length }, O);
    }
    ev.source.postMessage({ cmd: 'done', total: n }, O); log('تم');
    setTimeout(() => window.close(), 1500);   /* (user 2026-11-13: «هذا لازم يغلق بعد التمام») the files are already handed over */
  } catch (e) { ev.source.postMessage({ cmd: 'error', msg: String(e) }, O); log('خطأ ' + e); }
});
</script>
</body>
