<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مجموعتا شخصيات الكرتون</title><link rel="stylesheet" href="/style.css"><style>.groups{display:flex;gap:10px;margin-top:17px;flex-wrap:wrap}.groups button{flex:1}.groups button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}.style-note{margin-top:8px;font-size:14px}</style></head><body>
<header><p class="eyebrow">مكتبة الكرتون · مجموعتان · ٢٠ نموذجاً</p><h1>شخصيات بأسلوبين</h1><p>عشرة نماذج في كل مجموعة، جميعهم بلا ملامح وجه.</p><div id="styles" class="groups" role="group" aria-label="اختيار المجموعة"></div></header>
<main><aside><h2>الشخصيات</h2><nav id="characters" aria-label="اختيار الشخصية"></nav></aside><section class="stage"><div class="stage-title"><div><h2 id="name"></h2><p id="description"></p></div><span class="tag" id="style-name"></span></div><canvas id="preview" width="600" height="740" aria-label="معاينة الشخصية المتحركة"></canvas><div id="motions" role="group" aria-label="اختيار الحركة"></div><div class="options"><button id="pause" type="button">إيقاف الحركة</button><button id="flip" type="button" aria-pressed="false">عكس الاتجاه</button><label><input type="checkbox" id="bones"> إظهار المفاصل</label></div><p class="hint">بدّل المجموعة لمقارنة الشخصية نفسها بالأسلوب الآخر، ثم جرّب حركتها.</p></section></main><script type="module" src="/main.ts"></script></body></html>
