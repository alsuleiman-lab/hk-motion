<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة شخصيات الكرتون</title><link rel="stylesheet" href="/style.css"></head><body>
<header><p class="eyebrow">مكتبة الكرتون · ١٠ شخصيات</p><h1>شخصيات قصصنا</h1><p>اختر الشخصية والحركة لتجربتها. جميع الشخصيات بلا ملامح وجه.</p></header>
<main><aside><h2>الشخصيات</h2><nav id="characters" aria-label="اختيار الشخصية"></nav></aside><section class="stage"><div class="stage-title"><div><h2 id="name"></h2><p id="description"></p></div><span class="tag">قصاصات ورقية</span></div><canvas id="preview" width="600" height="740" aria-label="معاينة الشخصية المتحركة"></canvas><div id="motions" role="group" aria-label="اختيار الحركة"></div><div class="options"><button id="pause" type="button">إيقاف الحركة</button><button id="flip" type="button" aria-pressed="false">عكس الاتجاه</button><label><input type="checkbox" id="bones"> إظهار المفاصل</label></div><p class="hint">الشرح إيماءة عامة قابلة للتوقيت مع كلام المتحدث في الفيديو. حمل الصندوق يربط اليدين بالعنصر.</p></section></main>
<script type="module" src="/main.ts"></script></body></html>
